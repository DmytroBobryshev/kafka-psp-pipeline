# SPA config: every non-file path falls back to index.html so TanStack Router's routes
# (/dashboard, /dlq, ...) survive a hard refresh. /api never reaches this server - the
# cluster ingress routes it to api-gateway before the UI is even considered, and the Vite
# dev server proxies it locally - so no proxy_pass here, on purpose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached: it is the pointer to the hashed bundles, and a stale
    # copy references assets a newer image no longer ships (page loads unstyled).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Hashed bundle assets are immutable by construction - cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
