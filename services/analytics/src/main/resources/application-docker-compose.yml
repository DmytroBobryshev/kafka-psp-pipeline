spring:
  data:
    mongodb:
      uri: mongodb://analytics:analytics_pw@localhost:27017/analytics?authSource=analytics

  kafka:
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094

    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="analytics" password="${ANALYTICS_KAFKA_PASSWORD}";'

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 5

analytics:
  schema-registry:
    url: http://localhost:8081

  disputes:
    minio:
      endpoint: http://localhost:${MINIO_API_PORT:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD}

  streams:
    state-dir: ${user.home}/.kafka-psp/analytics-streams-state

management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
