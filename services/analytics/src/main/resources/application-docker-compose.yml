# M10: run analytics against the infra/compose stack (infra/compose/README.md, .env).
# Activate with SPRING_PROFILES_ACTIVE=docker-compose (same convention as every other service).
spring:
  data:
    mongodb:
      # infra/compose/.env: ANALYTICS_DB / ANALYTICS_DB_USER / ANALYTICS_DB_PASSWORD.
      # authSource=analytics because infra/compose/mongo/init/01-init-databases.sh creates this
      # user scoped to (and only to) the analytics database - same "physical vs logical
      # separation" shortcut as Postgres (ADR-0005), same as webhook-notifier's equivalent entry.
      uri: mongodb://analytics:analytics_pw@localhost:27017/analytics?authSource=analytics

  kafka:
    # Three brokers' HOST-side (EXTERNAL) listeners - same rationale as every other service's
    # equivalent entry (infra/compose/README.md's advertised-listeners section). Kafka Streams
    # reads this through KafkaProperties in config.KafkaStreamsConfig.
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094

    # ---- M14: SASL/SCRAM-SHA-512 ---------------------------------------------------------------
    # The EXTERNAL listener above requires authentication as of M14. `spring.kafka.properties` is
    # the COMMON block: Spring Boot merges it into the producer, the consumer AND the admin client,
    # which is what makes one four-line block enough for a service that is several of those at
    # once. Putting it under spring.kafka.consumer.properties instead is the classic half-fix - the
    # consumer connects and the producer does not.
    #
    # The USERNAME is committed on purpose: it is this service's identity, not a secret, and it is
    # the exact string the ACLs in infra/compose/kafka-init/init-security.sh key off
    # (User:analytics). The PASSWORD is a placeholder resolved from the environment, and has no
    # default - a service that silently starts with the wrong credential produces authorization
    # errors that look like a missing ACL and waste an hour, so it fails fast instead:
    #
    #   set -a; . infra/compose/.env; set +a
    #   SPRING_PROFILES_ACTIVE=docker-compose mvn -pl services/analytics -am spring-boot:run
    #
    # This block lives in the docker-compose profile ONLY. The default profile and the test profile
    # stay unauthenticated, so @EmbeddedKafka in `mvn verify` is unaffected.
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="analytics" password="${ANALYTICS_KAFKA_PASSWORD}";'

# analytics runs on the HOST (java -jar ...), so it reaches Schema Registry via its published host
# port - localhost:8081, same convention as every other service's equivalent entry.
# M16/ADR-0009: same convention as payment-api/application-docker-compose.yml's identical block.
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 5

analytics:
  schema-registry:
    url: http://localhost:8081

  # M13: same host/compose-network split as schema-registry above - analytics runs on the HOST, so
  # it reaches MinIO via its published host port (infra/compose/.env's MINIO_API_PORT).
  disputes:
    minio:
      endpoint: http://localhost:${MINIO_API_PORT:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD}

  streams:
    # A STABLE, NAMED path, not ${java.io.tmpdir}. Two reasons, both operational:
    #   1. The state-restore proof deletes this directory and restarts the service. A path under
    #      /var/folders/... on macOS is both hard to find and eligible for OS cleanup, which makes
    #      "did the state really come back from the changelog?" impossible to answer honestly.
    #   2. Disk. 12 tasks x 1 window store = 12 RocksDB directories under here. Knowing exactly
    #      where they are is the difference between `du -sh` and guessing.
    # Inspect / wipe with:
    #   du -sh ~/.kafka-psp/analytics-streams-state/analytics-streams.v1
    #   rm -rf  ~/.kafka-psp/analytics-streams-state
    state-dir: ${user.home}/.kafka-psp/analytics-streams-state

# M15: analytics runs on the HOST, so it reaches Tempo via its published OTLP/HTTP port
# (infra/compose/.env's TEMPO_OTLP_HTTP_PORT, default 4318) - same host/compose-network split
# every other infra address in this file already follows.
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
