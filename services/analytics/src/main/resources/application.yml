spring:
  application:
    name: analytics

  kafka:

  data:
    mongodb:
      auto-index-creation: true # creates merchant_window_idx from the @CompoundIndex on the document

server:
  port: 8089

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0

analytics:
  kafka:
    payment-status-changed-topic: payments.payment-status-changed.v1
    merchant-config-changed-topic: merchants.merchant-config-changed.v1
    payment-requested-topic: payments.payment-requested.v1

  streams:
    application-id: analytics-streams.v1

    state-dir: ${java.io.tmpdir}/kafka-psp/analytics-streams

    num-stream-threads: 2

    processing-guarantee: at_least_once

    application-server: localhost:8089

    commit-interval: 5s

    state-store-cache-max-bytes: 10485760 # 10 MiB, the Kafka default

  windows:
    size: 60s

    grace: 30s

    store-retention: 15m

    changelog-additional-retention: 5m

  authorization-join:
    window: 5m
    grace: 30s

  disputes:
    dispute-opened-topic: disputes.dispute-opened.v1
    group-id: analytics.dispute-projection.v1
    minio:
      bucket: disputes

  batch-listener:
    group-id: analytics.status-audit-batch.v1
    max-poll-records: 200
