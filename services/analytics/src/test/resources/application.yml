spring:
  application:
    name: analytics
  data:
    mongodb:
      uri: mongodb://localhost:27017/analytics_test
      auto-index-creation: false
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      auto-startup: false

analytics:
  schema-registry:
    url: http://localhost:8081
  kafka:
    payment-status-changed-topic: payments.payment-status-changed.v1
    merchant-config-changed-topic: merchants.merchant-config-changed.v1
    payment-requested-topic: payments.payment-requested.v1
  streams:
    application-id: analytics-streams.test.v1
    state-dir: ${java.io.tmpdir}/kafka-psp/analytics-streams-test
    num-stream-threads: 1
    processing-guarantee: at_least_once
    application-server: localhost:8089
    commit-interval: 5s
    state-store-cache-max-bytes: 1048576
  windows:
    size: 60s
    grace: 30s
    store-retention: 15m
    changelog-additional-retention: 5m
  authorization-join:
    window: 5m
    grace: 30s
  batch-listener:
    group-id: analytics.status-audit-batch.test.v1
    max-poll-records: 200
  disputes:
    dispute-opened-topic: disputes.dispute-opened.test.v1
    group-id: analytics.dispute-projection.test.v1
    minio:
      bucket: disputes
      endpoint: http://localhost:9000
      access-key: test
      secret-key: test
