# M4: run psp-connector against the infra/compose stack (infra/compose/README.md, .env).
# Activate with SPRING_PROFILES_ACTIVE=docker-compose (same convention as payment-api).
spring:
  datasource:
    # infra/compose/.env: PSP_CONNECTOR_DB / PSP_CONNECTOR_DB_USER / PSP_CONNECTOR_DB_PASSWORD.
    # This user can only ever connect to the psp_connector database (ADR-0005's per-service
    # Postgres grant, enforced at the container level).
    url: jdbc:postgresql://localhost:5432/psp_connector
    username: psp_connector
    password: psp_connector_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema (db/migration/V1__create_payment_attempts_table.sql); Hibernate
      # only verifies the entity mapping matches what Flyway created.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Three brokers' HOST-side (EXTERNAL) listeners - same rationale as payment-api's equivalent
    # entry (infra/compose/README.md's advertised-listeners section).
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094

    # ---- M14: SASL/SCRAM-SHA-512 ---------------------------------------------------------------
    # The EXTERNAL listener above requires authentication as of M14. `spring.kafka.properties` is
    # the COMMON block: Spring Boot merges it into the producer, the consumer AND the admin client,
    # which is what makes one four-line block enough for a service that is several of those at
    # once. Putting it under spring.kafka.consumer.properties instead is the classic half-fix - the
    # consumer connects and the producer does not.
    #
    # The USERNAME is committed on purpose: it is this service's identity, not a secret, and it is
    # the exact string the ACLs in infra/compose/kafka-init/init-security.sh key off
    # (User:psp-connector). The PASSWORD is a placeholder resolved from the environment, and has no
    # default - a service that silently starts with the wrong credential produces authorization
    # errors that look like a missing ACL and waste an hour, so it fails fast instead:
    #
    #   set -a; . infra/compose/.env; set +a
    #   SPRING_PROFILES_ACTIVE=docker-compose mvn -pl services/psp-connector -am spring-boot:run
    #
    # This block lives in the docker-compose profile ONLY. The default profile and the test profile
    # stay unauthenticated, so @EmbeddedKafka in `mvn verify` is unaffected.
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="psp-connector" password="${PSP_CONNECTOR_KAFKA_PASSWORD}";'

# M9 Phase 1: psp-connector runs on the HOST (java -jar ...), so it reaches Schema Registry via
# its published host port - localhost:8081, per infra/compose/.env's SCHEMA_REGISTRY_PORT - same
# host/compose-network split as bootstrap-servers above.
psp-connector:
  schema-registry:
    url: http://localhost:8081

# M15: same host/compose-network split as schema-registry above.
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
