spring:
  application:
    name: psp-connector

  kafka:

    consumer:
      group-id: psp-connector.v1

      auto-offset-reset: earliest

      properties:
        max.poll.records: 10

        max.poll.interval.ms: 300000

        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 2147483647
      batch-size: 32768
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        schema.registry.url: ${psp-connector.schema-registry.url}
        auto.register.schemas: true

server:
  port: 8086

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0

psp-connector:
  kafka:
    payment-requested-topic: payments.payment-requested.v1
    payment-status-changed-topic: payments.payment-status-changed.v1
    funds-reserved-topic: refunds.funds-reserved.v1
    refund-completed-topic: refunds.refund-completed.v1
    refund-failed-topic: refunds.refund-failed.v1
    refund-status-changed-topic: refunds.refund-status-changed.v1
    provider-status-query-topic: psp.provider-status-query.v1

  dlq-replay:
    dlq-topic: payments.payment-requested.v1.psp-connector.dlq
    consumer-group: psp-connector.dlq-replay.v1
    max-batch-size: 50
    poll-timeout-ms: 2000

  provider:
    min-latency-ms: 100
    max-latency-ms: 5000
    decline-rate: 0.10
    timeout-rate: 0.05
    forced-latency-ms: 0
    forced-outcome: NONE
    duplicate-rate: 0

    refund-decline-rate: 0.10
    refund-forced-outcome: NONE

    magic-amounts:
      enabled: true

