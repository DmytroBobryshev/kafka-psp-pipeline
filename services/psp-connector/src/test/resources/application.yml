# Test-classpath override of src/main/resources/application.yml. PspConnectorApplicationTests
# only needs the Spring context to load against an @EmbeddedKafka broker and an in-memory H2
# database - the real integration is exercised for real against the live infra/compose stack,
# captured in README.md, not reproduced here.
spring:
  application:
    name: psp-connector
  datasource:
    url: jdbc:h2:mem:pspconnector;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    # Overridden at runtime by @EmbeddedKafka's broker address (spring.kafka.bootstrap-servers
    # system property it sets) - this value only matters before that override applies.
    bootstrap-servers: localhost:9092
    consumer:
      group-id: psp-connector.test.v1
      auto-offset-reset: earliest
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000

psp-connector:
  kafka:
    payment-requested-topic: payments.payment-requested.v1
    payment-status-changed-topic: payments.payment-status-changed.v1
    # M11: only PRESENCE matters for a context-load test, not reachability.
    funds-reserved-topic: refunds.funds-reserved.v1
    refund-completed-topic: refunds.refund-completed.v1
    refund-failed-topic: refunds.refund-failed.v1
    # M12: only PRESENCE matters for a context-load test, not reachability.
    provider-status-query-topic: psp.provider-status-query.v1
  # M9 Phase 1: KafkaAvroDeserializer only resolves this lazily (on first poll() that actually
  # needs to fetch/cache a schema) - PspConnectorApplicationTests never publishes to the topic, so
  # this value only needs to be present, not reachable.
  schema-registry:
    url: http://localhost:8081
  # M17: only PRESENCE matters for a context-load test, not reachability - see
  # src/main/resources/application.yml for what these mean.
  dlq-replay:
    dlq-topic: payments.payment-requested.v1.psp-connector.dlq
    consumer-group: psp-connector.dlq-replay.v1
    max-batch-size: 50
    poll-timeout-ms: 2000
  provider:
    min-latency-ms: 0
    max-latency-ms: 1
    decline-rate: 0.0
    timeout-rate: 0.0
    forced-latency-ms: 0
    forced-outcome: NONE
    duplicate-rate: 0.0
    refund-decline-rate: 0.0
    refund-forced-outcome: NONE
