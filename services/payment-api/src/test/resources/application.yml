spring:
  application:
    name: payment-api
  datasource:
    url: jdbc:h2:mem:paymentapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      properties:
        max.block.ms: 2000
    consumer:
      auto-offset-reset: latest

payment-api:
  kafka:
    payment-requested-topic: payments.payment-requested.v1
    merchant-config-changed-topic: merchants.merchant-config-changed.v1
    provider-status-query-topic: psp.provider-status-query.v1
    provider-status-reply-topic: psp.provider-status-reply.v1
    payment-status-changed-topic: payments.payment-status-changed.v1
    payment-status-view-group-id: payment-api.status-view.test.v1
    merchant-view-group-id: payment-api.merchant-view.test.v1
    dispute-opened-topic: disputes.dispute-opened.test.v1
    refund-status-changed-topic: refunds.refund-status-changed.v1
    refund-completed-topic: refunds.refund-completed.v1
    refund-failed-topic: refunds.refund-failed.v1
    funds-reserved-topic: refunds.funds-reserved.v1
    refund-status-view-group-id: payment-api.refund-status-view.test.v1
    refund-completed-view-group-id: payment-api.refund-completed-view.test.v1
    refund-failed-view-group-id: payment-api.refund-failed-view.test.v1
    refund-funds-reserved-view-group-id: payment-api.refund-funds-reserved-view.test.v1
  schema-registry:
    url: http://localhost:8081
  disputes:
    claim-check-threshold-bytes: 524288
    claim-check-enabled: true
    minio:
      bucket: disputes
      endpoint: http://localhost:9000
      access-key: test
      secret-key: test
