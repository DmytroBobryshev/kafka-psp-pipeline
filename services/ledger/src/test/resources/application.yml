spring:
  application:
    name: ledger
  datasource:
    url: jdbc:h2:mem:ledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger.test.v1
      auto-offset-reset: earliest
      properties:
        max.poll.records: 50
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false

ledger:
  instance-id: test
  fail-after-produce: false
  schema-registry:
    url: http://localhost:8081
  kafka:
    payment-status-changed-topic: payments.payment-status-changed.v1
    ledger-entry-recorded-topic: ledger.ledger-entry-recorded.v1
    refund-requested-topic: refunds.refund-requested.v1
    funds-reserved-topic: refunds.funds-reserved.v1
    refund-completed-topic: refunds.refund-completed.v1
    refund-failed-topic: refunds.refund-failed.v1
    reservation-released-topic: refunds.reservation-released.v1
    transactional-id-prefix: ledger-tx-test-
  refund:
    reservation-ttl: PT2M
    sweep-interval: PT10S
  dlq-replay:
    dlq-topic: payments.payment-status-changed.v1.ledger.dlq
    consumer-group: ledger.dlq-replay.v1
    max-batch-size: 50
    poll-timeout-ms: 2000
