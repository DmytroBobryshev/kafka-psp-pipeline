# M16/ADR-0009: the OTHER half of the profile switch, made real now rather than left aspirational
# for M18. This file is NOT exercised by anything yet - infra/k8s/ is still just kind.yaml and a
# hello-world manifest (M18 builds the actual namespace/Deployments/Services this profile
# targets) - but the config exists today, is real Spring config, and is what api-gateway will
# read the moment SPRING_PROFILES_ACTIVE=k8s is set inside a pod. See README.md "k8s profile
# (untested until M18)" for the honest caveat and services/discovery-server/README.md for the
# argument this whole profile split exists to demonstrate.
#
# eureka.client.enabled is deliberately absent (not just "false"): api-gateway's own
# spring-cloud-starter-netflix-eureka-client dependency ships in the image unconditionally (a
# few MB it will never use here - ADR-0009's own accepted cost), but this profile never sets
# eureka.client.enabled: true anywhere, so Spring's default for that autoconfiguration (disabled
# unless explicitly turned on) already matches ADR-0009's "spring.cloud.discovery.enabled=false"
# instruction without repeating it.
spring:
  data:
    redis:
      # Illustrative Kubernetes Service DNS name (ADR-0009's own convention:
      # http://payment-api.psp.svc.cluster.local) - the "psp" namespace and this exact Service
      # name are M18's decision to make, not this module's; this is the config shape, not a
      # verified address.
      host: redis.psp.svc.cluster.local
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          # Same six routes as application-docker-compose.yml, same filters (payment-api keeps
          # its CircuitBreaker) - only the `uri` scheme changes: a direct Kubernetes Service DNS
          # name instead of Eureka-resolved lb://, per ADR-0009 ("Gateway routes target
          # Kubernetes Services directly by DNS ... Load balancing is kube-proxy's job"). Ports
          # match each service's own server.port (application.yml), not ADR-0009's illustrative
          # :8080 - see that ADR's "Decision" section, which uses 8080 as a stand-in example, not
          # a literal value.
          routes:
            - id: payment-api
              uri: http://payment-api.psp.svc.cluster.local:8085
              predicates:
                - Path=/api/payments/**,/api/merchants/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentApiCB
                    fallbackUri: forward:/fallback/payment-api
            - id: ledger
              uri: http://ledger.psp.svc.cluster.local:8087
              predicates:
                - Path=/api/refunds/**
            - id: webhook-notifier
              uri: http://webhook-notifier.psp.svc.cluster.local:8088
              predicates:
                - Path=/api/webhooks/**
            - id: analytics
              uri: http://analytics.psp.svc.cluster.local:8089
              predicates:
                - Path=/api/analytics/**
            - id: realtime-gateway
              uri: http://realtime-gateway.psp.svc.cluster.local:8090
              predicates:
                - Path=/api/realtime/**
            - id: psp-connector
              uri: http://psp-connector.psp.svc.cluster.local:8086
              predicates:
                - Path=/api/psp-connector/**
              filters:
                - StripPrefix=2

management:
  otlp:
    tracing:
      # Illustrative - M18/M15-on-k8s would deploy Tempo (or reuse the compose one via
      # port-forward) under some Service name; this is not a verified address.
      endpoint: http://tempo.observability.svc.cluster.local:4318/v1/traces
