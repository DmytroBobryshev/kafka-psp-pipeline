# M12: run realtime-gateway against the infra/compose stack (infra/compose/README.md, .env).
# Activate with SPRING_PROFILES_ACTIVE=docker-compose (same convention as every other service).
spring:
  kafka:
    # Three brokers' HOST-side (EXTERNAL) listeners - same rationale as every other service's
    # equivalent entry (infra/compose/README.md's advertised-listeners section).
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094

# realtime-gateway runs on the HOST (java -jar ...), so it reaches Schema Registry via its
# published host port - localhost:8081, per infra/compose/.env's SCHEMA_REGISTRY_PORT - same
# host/compose-network split every other service's equivalent entry uses.
realtime-gateway:
  schema-registry:
    url: http://localhost:8081
