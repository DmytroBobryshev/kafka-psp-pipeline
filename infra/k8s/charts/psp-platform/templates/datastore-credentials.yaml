{{/*
  Every Postgres and MongoDB credential in the system, in one Secret, GENERATED - never written
  down anywhere in this repo.

  Phase 1 established the rule for Kafka: nobody chooses a password, Strimzi generates one per
  KafkaUser into a Secret, and there is no `.env`. The datastores have no operator doing that for
  them, so the chart does it: `randAlphaNum` on first install, and on every subsequent `helm
  upgrade` the `lookup` below finds the Secret that already exists and re-emits the SAME value.

  That re-emit is not a nicety. Postgres and MongoDB only run their init scripts on an EMPTY data
  directory; the PVC survives a `helm upgrade`, so a regenerated password would leave the chart
  and the database disagreeing, and every service would fail authentication on its next restart -
  a failure that looks like a network problem and is not.

  Two consequences worth knowing:
   * `helm template` / `--dry-run` cannot call the API server, so `lookup` returns nothing and the
     rendered output shows fresh passwords every time. That is a rendering artefact, not a diff.
   * `kubectl delete secret psp-datastore-credentials` is NOT a rotation - it is a way to break
     the cluster. Real rotation means ALTER USER in Postgres / db.changeUserPassword in Mongo and
     then updating the Secret, or deleting the PVCs and starting clean. Contrast with the Kafka
     side, where deleting the Secret genuinely IS the rotation because the User Operator owns both
     halves. That asymmetry is the argument for operators, in one paragraph.
*/}}
{{- $ns := .Release.Namespace -}}
{{- $name := .Values.global.datastoreSecretName -}}
{{- $existing := (lookup "v1" "Secret" $ns $name) -}}
{{- $data := dict -}}
{{- if $existing }}{{- $data = $existing.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "psp.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall`. The PVCs do not (they are plain chart resources), so an
    # uninstall/install cycle gives a fresh, empty database whose init scripts run against these
    # SAME credentials - which is exactly the pairing that has to hold. Deleting the Secret
    # instead would leave the passwords and any surviving data directory disagreeing.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $key := list
      "postgres-superuser-password"
      "payment-api-db-password"
      "ledger-db-password"
      "psp-connector-db-password"
      "mongo-root-password"
      "webhook-notifier-db-password"
      "analytics-db-password"
      "audit-trail-db-password" }}
  {{ $key }}: {{ index $data $key | default (randAlphaNum 24 | b64enc) }}
{{- end }}
