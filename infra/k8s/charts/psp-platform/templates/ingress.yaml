{{- if .Values.ingress.enabled }}
{{/*
  The one route into the cluster from the laptop.

  WHY ONLY api-gateway HAS AN INGRESS. Every other service is reachable only through it: ADR-0004
  removed service-to-service HTTP, and M16 made api-gateway the single edge with the rate limiter,
  the CORS policy and payment-api's circuit breaker on it. Publishing payment-api directly would
  route around all three. `kubectl port-forward` remains available for debugging, which is the
  right place for a back door - a human typing a command, not a permanent Ingress object.

  HOW THE PACKET GETS HERE on kind, which is not obvious and is the part people get wrong:

    curl http://localhost/api/payments
      -> the host's port 80
      -> kind.yaml's extraPortMappings publishes container port 80 of the CONTROL-PLANE node
      -> ingress-nginx's controller Pod, which is pinned to that node (nodeSelector
         ingress-ready=true, a label kind.yaml puts on the control plane) and uses hostPort
      -> this Ingress' rule
      -> Service api-gateway:8000 -> the pod

  Remove any link in that chain and you get a connection refused that looks like DNS.

  THE UI (M17, full build): a static React bundle behind nginx (charts/ui), published at "/"
  below. The `/api`, `/actuator` and `/fallback` prefixes are matched first (nginx-ingress sorts
  by prefix length, so ordering in this list does not matter). Served same-origin with the API,
  so the gateway's CORS allowedOrigins (still http://localhost:5173 for the Vite dev server)
  never applies to it - same-origin requests need no CORS at all.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: psp-edge
  labels:
    app.kubernetes.io/name: psp-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: psp-platform
  annotations:
    # realtime-gateway's SSE stream is proxied through the gateway on /api/realtime/**. Without
    # these three, nginx buffers the response and the browser sees nothing until the stream ends,
    # and then kills it at the 60 s default read timeout - an SSE endpoint that "works in curl
    # but not through the ingress" is almost always this.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # M13: nginx-ingress's own default (1m) would 413 the claim-check demo's base64-encoded
    # multi-megabyte dispute document before it ever reaches payment-api - a DIFFERENT size limit
    # than the one the demo is about (Kafka's max.request.size). 16m comfortably covers the
    # README's 5 MiB document example plus base64's ~33% inflation plus JSON overhead.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /fallback
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
{{- end }}
