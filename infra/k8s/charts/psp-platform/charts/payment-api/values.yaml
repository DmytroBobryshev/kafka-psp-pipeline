# payment-api never produces to Kafka directly (M6): it writes an outbox_event row inside the same
# Postgres transaction as the payment, and the Debezium connector in the kafka-connect subchart is
# what turns that row into a record. Its `Write` ACL on payments.payment-requested.v1 exists and is
# deliberately unused - the "allowed" half of M14's proof.

port: 8085
replicas: 1

# The Strimzi-generated Secret for User:payment-api.
kafkaUser: "payment-api"

# Contributors added to Spring Boot's `readiness` health group, i.e. to
# /actuator/health/readiness, i.e. to what kube-proxy uses to decide whether this pod is in the
# Service's endpoint list. `readinessState` alone is the servlet-level answer M15 proved can be
# UP while nothing is consuming; the extra names come from libs/common-health.
readinessInclude: readinessState,kafkaListeners

resources:
  requests:
    memory: 512Mi
    cpu: 150m
  limits:
    memory: 768Mi
    cpu: 1000m

# Extra environment. Secrets only - anything non-secret belongs in `config` below, where it is
# readable without `kubectl get secret`.
env:
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: psp-datastore-credentials
        key: payment-api-db-password

# Rendered into /config/application-k8s.yml (through `tpl`, so Helm expressions work). This is the
# HIGHEST-precedence Spring config document in the pod.
config: |
  spring:
    datasource:
      url: jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/payment_api
      username: payment_api
      driver-class-name: org.postgresql.Driver
      # SPRING_DATASOURCE_PASSWORD arrives as an env var from the generated Secret - see values.yaml.
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
    flyway:
      enabled: true
      locations: classpath:db/migration
  {{- include "psp.kafkaClientConfig" . | nindent 2 }}
  payment-api:
    schema-registry:
      url: {{ .Values.global.schemaRegistryUrl }}
  psp:
    health:
      kafka:
        enabled: true
  {{ include "psp.commonConfig" . }}
