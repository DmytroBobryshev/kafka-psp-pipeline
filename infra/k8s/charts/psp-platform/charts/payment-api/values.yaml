# payment-api never produces to Kafka directly (M6): it writes an outbox_event row inside the same
# Postgres transaction as the payment, and the Debezium connector in the kafka-connect subchart is
# what turns that row into a record. Its `Write` ACL on payments.payment-requested.v1 exists and is
# deliberately unused - the "allowed" half of M14's proof.
#
# NO kafkaListeners CONTRIBUTOR, and this is not an oversight. M12 gave this service a Kafka
# CONSUMER (config.ReplyingKafkaConfig, the provider-status-reply request/response wiring), but
# that consumer's KafkaMessageListenerContainer is hand-built and handed straight to a
# ReplyingKafkaTemplate - it is never a `@KafkaListener` method, so it is never registered with the
# KafkaListenerEndpointRegistry libs/common-health's indicator inspects. Turning the indicator on
# here would not fail loudly; it would silently report UP over zero containers forever, which is
# the same "green but meaningless" failure mode M15 exists to eliminate, just self-inflicted this
# time. See ledger/webhook-notifier/psp-connector/realtime-gateway/analytics for services where the
# contributor watches something real.

port: 8085
replicas: 1

# The Strimzi-generated Secret for User:payment-api.
kafkaUser: "payment-api"

# Contributors added to Spring Boot's `readiness` health group, i.e. to
# /actuator/health/readiness, i.e. to what kube-proxy uses to decide whether this pod is in the
# Service's endpoint list. `readinessState` alone is the servlet-level answer M15 proved can be
# UP while nothing is consuming - but payment-api has no @KafkaListener-managed containers for the
# extra name to watch (see the top comment), so unlike its siblings it stays at readinessState.
readinessInclude: readinessState

resources:
  requests:
    memory: 512Mi
    cpu: 150m
  limits:
    memory: 768Mi
    cpu: 1000m

# Extra environment. Secrets only - anything non-secret belongs in `config` below, where it is
# readable without `kubectl get secret`.
env:
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: psp-datastore-credentials
        key: payment-api-db-password
  # M13: MinIO root credential (charts/minio/values.yaml's top comment explains the
  # single-credential simplification). Not PAYMENT_API_DISPUTES_MINIO_SECRET_KEY directly in
  # `config` below because it is a secret - same rule SPRING_DATASOURCE_PASSWORD above follows.
  - name: PAYMENT_API_DISPUTES_MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: psp-datastore-credentials
        key: minio-root-password

# Rendered into /config/application-k8s.yml (through `tpl`, so Helm expressions work). This is the
# HIGHEST-precedence Spring config document in the pod.
config: |
  spring:
    datasource:
      url: jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/payment_api
      username: payment_api
      driver-class-name: org.postgresql.Driver
      # SPRING_DATASOURCE_PASSWORD arrives as an env var from the generated Secret - see values.yaml.
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
    flyway:
      enabled: true
      locations: classpath:db/migration
  {{- include "psp.kafkaClientConfig" . | nindent 2 }}
  payment-api:
    schema-registry:
      url: {{ .Values.global.schemaRegistryUrl }}
    # M13: PAYMENT_API_DISPUTES_MINIO_SECRET_KEY (env, above) supplies secret-key - Spring's
    # relaxed binding maps that env var name onto payment-api.disputes.minio.secret-key, so it is
    # deliberately absent here (same split as spring.datasource.password/SPRING_DATASOURCE_PASSWORD
    # just above).
    disputes:
      claim-check-threshold-bytes: 524288
      claim-check-enabled: true
      minio:
        bucket: {{ .Values.global.minio.bucket }}
        endpoint: {{ .Values.global.minio.endpoint }}
        access-key: {{ .Values.global.minio.accessKey }}
  # psp.health.kafka.enabled deliberately absent (defaults to false, see
  # KafkaHealthAutoConfiguration): no @KafkaListener containers exist here for the "kafkaListeners"
  # bean to inspect - see the top-of-file comment - so creating it would just be dead weight, and
  # readinessInclude above does not name it.
  {{ include "psp.commonConfig" . }}
