# REPLICAS STAYS AT 1, and this is a correctness constraint rather than a resource one.
# ledger's transactional.id is `ledger-tx-${ledger.instance-id}-` (application.yml) with
# instance-id defaulting to 0, so two pods from the same Deployment would both claim
# `ledger-tx-0-...`; the second producer to call initTransactions fences the first, which is
# Kafka working exactly as designed and the service failing. Scaling ledger therefore needs a
# StatefulSet (stable ordinal -> instance-id) rather than more replicas - noted in
# infra/k8s/README.md and deliberately out of scope for this phase.

port: 8087
replicas: 1

# The Strimzi-generated Secret for User:ledger.
kafkaUser: "ledger"

# Contributors added to Spring Boot's `readiness` health group, i.e. to
# /actuator/health/readiness, i.e. to what kube-proxy uses to decide whether this pod is in the
# Service's endpoint list. `readinessState` alone is the servlet-level answer M15 proved can be
# UP while nothing is consuming; the extra names come from libs/common-health.
readinessInclude: readinessState,kafkaListeners

resources:
  requests:
    memory: 512Mi
    cpu: 150m
  limits:
    memory: 768Mi
    cpu: 1000m

# Extra environment. Secrets only - anything non-secret belongs in `config` below, where it is
# readable without `kubectl get secret`.
env:
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: psp-datastore-credentials
        key: ledger-db-password

# Rendered into /config/application-k8s.yml (through `tpl`, so Helm expressions work). This is the
# HIGHEST-precedence Spring config document in the pod.
config: |
  spring:
    datasource:
      url: jdbc:postgresql://{{ .Values.global.postgres.host }}:{{ .Values.global.postgres.port }}/ledger
      username: ledger
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
    flyway:
      enabled: true
      locations: classpath:db/migration
  {{- include "psp.kafkaClientConfig" . | nindent 2 }}
  ledger:
    schema-registry:
      url: {{ .Values.global.schemaRegistryUrl }}
  psp:
    health:
      kafka:
        enabled: true
  {{ include "psp.commonConfig" . }}
