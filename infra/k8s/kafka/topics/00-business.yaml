# Business topics - docs/diagrams/topic-map.md, "Business topics".
#
# THE POINT OF THIS FILE: infra/compose/create-topics.sh is an imperative script - it runs
# `kafka-topics --create --if-not-exists` and then, because that command silently refuses to alter
# an existing topic, a second pass of `kafka-configs --alter` for the compaction settings. Nothing
# in the cluster knows what the script intended, so the script's output is a claim, not a fact.
#
# Here the desired state IS the resource. The Topic Operator diffs each CR against the live topic
# every reconciliationIntervalMs and closes the gap, and `.status.conditions[Ready]` on the CR is
# the cluster's own answer to "did this apply", not a script's exit code.
#
# `metadata.name` doubles as the Kafka topic name. That works for every topic in the map because
# they are all valid DNS subdomain names (lowercase, dots, dashes). A topic whose name is not -
# `_schemas`, which Schema Registry creates - needs `spec.topicName` and a different metadata.name;
# it is not in the topic map, so it has no CR here (Schema Registry creates it itself, and its
# KafkaUser already carries the Create ACL for it).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments.payment-requested.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: psp   # REQUIRED - binds the topic to the Kafka CR named `psp`
spec:
  partitions: 12   # payment path: psp-connector is the KEDA-scaled service, highest parallelism
  replicas: 3
  config:
    retention.ms: "604800000"     # 7 d
    cleanup.policy: delete
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
