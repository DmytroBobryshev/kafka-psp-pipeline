---
# M13: the claim-check demo's topic. One event per aggregate (a dispute is opened once, never
# updated on this topic - see the Avro schema's record-level doc), so - like
# payments.payment-requested.v1 above - keyed by its own aggregate id (disputeId) rather than
# merchantId: ADR-0003's "ordering is vacuous on a one-event-per-aggregate topic" exception.
# 3 partitions (low volume: disputes are rare next to payments, same tier as the config/DLQ
# topics), 30 d retention (an audit-trail-shaped record, same tier as ledger.ledger-entry-
# recorded.v1, not the 7 d payment-path default).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: disputes.dispute-opened.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: psp
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "2592000000"    # 30 d
    cleanup.policy: delete
    min.insync.replicas: "2"
---
# The compacted config topic. Everything below the cleanup.policy line is the M10 block from
# topic-map.md, and in compose it could NOT be expressed at creation time: `kafka-topics --create
# --if-not-exists` never alters an existing topic's configs, so create-topics.sh had to make a
# second `kafka-configs --alter` pass. Declaratively there is no such thing as a second pass -
# the operator reconciles the whole config map, create or update, every interval.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: merchants.merchant-config-changed.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: psp
spec:
  partitions: 3    # low volume; a GlobalKTable reads every partition anyway
  replicas: 3
  config:
    cleanup.policy: compact
    min.insync.replicas: "2"
    # The four "deliberately wrong for a real cluster" values that make the tombstone drill
    # watchable - full reasoning in docs/diagrams/topic-map.md and payment-api's README.
    min.cleanable.dirty.ratio: "0.1"    # default 0.5: half the log must be garbage before cleaning
    delete.retention.ms: "60000"        # default 24 h: how long a tombstone survives its cleaning pass
    segment.ms: "60000"                 # default 7 d: the cleaner never touches the ACTIVE segment
    segment.bytes: "1048576"            # default 1 GiB, same reason
    max.compaction.lag.ms: "60000"
