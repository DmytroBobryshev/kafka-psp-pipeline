# payment-api (:8085) - 18 bindings, matching init-security.sh's "--- payment-api ---" block.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: payment-api
  namespace: kafka
  labels:
    strimzi.io/cluster: psp
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      # Merchant config, produced DIRECTLY (M10) - the one topic this service does not reach
      # through the outbox. Read added for the merchant-view projection listener
      # (adapters.in.kafka.MerchantConfigChangedListener) - a second, independent consumer of the
      # same topic this principal also produces to.
      - resource: { type: topic, name: merchants.merchant-config-changed.v1, patternType: literal }
        operations: [Write, Read, Describe]
      # Request-reply (M12): sends the query, reads the reply.
      - resource: { type: topic, name: psp.provider-status-query.v1, patternType: literal }
        operations: [Write, Describe]
      - resource: { type: topic, name: psp.provider-status-reply.v1, patternType: literal }
        operations: [Read, Describe]
      # Granted although since M6 the outbox -> Debezium -> Connect path (User:connect) is what
      # actually writes these. This is the "allowed" half of PLAN.md's M14 proof - "payment-api
      # may write payments.requested but not ledger.entries, prove it by trying" - and a denial
      # demo is only honest if the permitted write genuinely succeeds with the same credential.
      - resource: { type: topic, name: payments.payment-requested.v1, patternType: literal }
        operations: [Write, Describe]
      - resource: { type: topic, name: refunds.refund-requested.v1, patternType: literal }
        operations: [Write, Describe]
      # M13: the claim-check demo. Direct produce (no outbox - domain.port.DisputeEventPublisher's
      # javadoc), so this Write, unlike the payments.payment-requested.v1 grant above, is the ONE
      # this service's own credential actually uses.
      - resource: { type: topic, name: disputes.dispute-opened.v1, patternType: literal }
        operations: [Write, Describe]
      # group.id is minted per instance (payment-api.replies.<host>.<suffix>, M12), so a literal
      # ACL would break on every restart. This is what prefixed resource patterns are for.
      - resource: { type: group, name: payment-api.replies., patternType: prefix }
        operations: [Read, Describe]
      # M19: the transactions panel's status-view listener - the same event ledger and
      # webhook-notifier already read, consumed here too as a third independent local projection
      # (ADR-0005). M22: also Write - the expiration engine's own producer
      # (adapters.out.kafka.KafkaPaymentExpirationPublisher) publishes EXPIRED records back onto
      # this SAME topic, consumed back through the Read grant above by this service's own listener.
      - resource: { type: topic, name: payments.payment-status-changed.v1, patternType: literal }
        operations: [Read, Write, Describe]
      # Fixed group id (payment-api.status-view.v1), unlike the per-instance replies group above -
      # an ordinary work-sharing consumer, so a prefix grant here is just this service's usual
      # "don't break on the next group-id suffix bump" convention, not a per-instance necessity.
      - resource: { type: group, name: payment-api.status-view., patternType: prefix }
        operations: [Read, Describe]
      # Merchant read-model listener (adapters.in.kafka.MerchantConfigChangedListener) - fixed
      # group id (payment-api.merchant-view.v1), prefixed per this service's usual convention.
      - resource: { type: group, name: payment-api.merchant-view., patternType: prefix }
        operations: [Read, Describe]
