# infra/compose/docker-compose.yml
#
# M2 - Infrastructure baseline for the Kafka PSP pipeline. See README.md in this directory for
# the full writeup: topology diagram, topics table, "prove it" experiments with real observed
# output, and troubleshooting.
#
# ============================================================================================
# THE #1 MISCONFIGURATION: KAFKA_ADVERTISED_LISTENERS (read this before touching listener config)
# ============================================================================================
# Every broker below opens FOUR listeners (M14 added BROKER and moved authentication onto
# INTERNAL/EXTERNAL - see README.md's "M14 - Security" section for the full listener map,
# principal list, ACL matrix and ROLLBACK procedure):
#
#   INTERNAL   (container port 9092)  - for clients running INSIDE this compose network
#                                        (schema-registry, kafka-connect, akhq, kafka-exporter).
#                                        Advertised as the container's Compose-DNS hostname,
#                                        e.g. `kafka1:9092` - only resolvable *inside* the
#                                        `kafka-psp-net` network. SASL_PLAINTEXT/SCRAM-SHA-512
#                                        as of M14 (was PLAINTEXT, and was named PLAINTEXT).
#   CONTROLLER (container port 9093)  - KRaft controller-quorum traffic ONLY (broker-to-broker
#                                        metadata replication). Never advertised to clients.
#                                        SASL_PLAINTEXT/PLAIN as of M14.
#   BROKER     (container port 9094)  - M14. Inter-broker replication ONLY
#                                        (`inter.broker.listener.name`), plus the bootstrap
#                                        channel kafka-init and the healthcheck use before any
#                                        SCRAM credential exists. SASL_PLAINTEXT/PLAIN. Not
#                                        published to the host.
#   EXTERNAL   (container port 29092) - for clients running on YOUR LAPTOP (the six Spring
#                                        services, kafka CLI, kcat, this README's
#                                        produce/consume commands). Advertised as
#                                        `localhost:<mapped-host-port>`.
#                                        SASL_PLAINTEXT/SCRAM-SHA-512 as of M14.
#
# Why PLAIN on the two broker-internal listeners and SCRAM on the two client listeners: SCRAM
# credentials are stored IN the cluster metadata log, so a broker cannot read the credential it
# would need in order to join the quorum that stores it. PLAIN credentials come from the broker's
# own config file and are therefore available at process start. The `broker` principal is a
# superuser; every client principal is SCRAM and is created by kafka-init after the cluster is up.
#
# Why three, and why does this matter: a Kafka client's first connection is to any broker in
# `bootstrap.servers`; that broker then hands back its FULL advertised.listeners metadata for
# every partition leader, and the client reconnects directly to whatever that metadata says.
# If a broker only advertises its Compose-internal hostname (`kafka1:9092`), a HOST client that
# initially reached it via `localhost:29092` receives `kafka1:9092` as the next address to
# dial - which does not resolve outside Docker's network - and the client hangs or errors with
# "no route to host" / DNS resolution failures. This is the single most common Kafka Docker
# misconfiguration (PLAN.md calls it out explicitly). The fix is exactly what's below: a
# distinct advertised host:port PER AUDIENCE, mapped through `listener.security.protocol.map`.
#
# Host-port note: all three brokers listen on container port 29092 for EXTERNAL, but each is
# published to a DIFFERENT host port (29092/29093/29094 - see .env) because only one process on
# your Mac can bind a given host port. Each broker's advertised EXTERNAL listener therefore
# names ITS OWN mapped host port, not the shared container port. Get this wrong (e.g. every
# broker advertising `localhost:29092`) and two of the three brokers become unreachable from
# the host even though `docker compose ps` shows all three healthy.
# ============================================================================================

networks:
  kafka-psp-net:
    name: kafka-psp-net
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  postgres-data:
  mongo-data:
  minio-data:
  prometheus-data:
  grafana-data:
  tempo-data:

# ==============================================================================================
# M14 - client properties files, rendered at `docker compose up` time from .env.
#
# `configs:` with inline `content:` (Compose Spec, docker compose >= 2.23) rather than a file
# committed under infra/compose/: these hold real credentials, so they must never exist on disk
# in the repository. Compose interpolates ${...} from .env and mounts the result read-only into
# whichever containers declare it. This is what lets `docker compose exec kafka1 kafka-topics
# --command-config ...` keep working now that the CLI has to authenticate.
# ==============================================================================================
configs:
  # The SASL/PLAIN broker superuser. Used by the brokers' own healthcheck and by kafka-init,
  # because both must work BEFORE any SCRAM credential exists in the cluster metadata.
  kafka-broker-admin-client:
    content: |
      security.protocol=SASL_PLAINTEXT
      sasl.mechanism=PLAIN
      sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_BROKER_USER}" password="${KAFKA_BROKER_PASSWORD}";
  # The SCRAM superuser for operator CLI work (create-topics.sh). Goes over the same
  # SASL/SCRAM-SHA-512 client listener every application uses - i.e. it exercises the real
  # authentication path rather than the brokers' private one.
  kafka-admin-client:
    content: |
      security.protocol=SASL_PLAINTEXT
      sasl.mechanism=SCRAM-SHA-512
      sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_ADMIN_USER}" password="${KAFKA_ADMIN_PASSWORD}";
  # AKHQ's credential. Merged with the committed, secret-free akhq/application.yml through
  # MICRONAUT_CONFIG_FILES - see the akhq service below for why not environment variables.
  akhq-security:
    content: |
      akhq:
        connections:
          kafka-psp-compose:
            properties:
              security.protocol: SASL_PLAINTEXT
              sasl.mechanism: SCRAM-SHA-512
              sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="akhq" password="${AKHQ_KAFKA_PASSWORD}";'

x-kafka-common: &kafka-common
  image: ${KAFKA_IMAGE}:${KAFKA_VERSION}
  networks: [kafka-psp-net]
  restart: unless-stopped
  configs:
    - source: kafka-broker-admin-client
      target: /etc/kafka/secrets/broker-admin.properties
    - source: kafka-admin-client
      target: /etc/kafka/secrets/admin.properties
  healthcheck:
    # Talks to the broker's OWN inter-broker listener from inside its own container - proves the
    # broker process is actually serving the Kafka protocol, not just that the port is open.
    # M14: this moved from 9092 to 9094 and gained --command-config. It deliberately does NOT use
    # the SCRAM listener: the healthcheck has to pass before kafka-init can create any SCRAM
    # credential, and kafka-init cannot run until the brokers are healthy. Pointing it at the
    # SCRAM listener is a deadlock, and it looks like a broker that never starts.
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 --command-config /etc/kafka/secrets/broker-admin.properties > /dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 40s
  environment: &kafka-common-env
    CLUSTER_ID: ${CLUSTER_ID}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT,BROKER:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
    # ---- M14: SASL ---------------------------------------------------------------------------
    # Broker-wide union of the mechanisms any listener may offer; the per-listener overrides
    # below are what actually decide, and they are deliberately narrow (a client on EXTERNAL
    # cannot fall back to PLAIN and log in as the broker superuser).
    KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
    KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
    KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
    KAFKA_LISTENER_NAME_BROKER_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
    KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
    # The PLAIN JAAS entry is used in BOTH directions on these two listeners: `username`/
    # `password` are what this broker PRESENTS when it dials another broker or a controller,
    # `user_<name>=<password>` is the map of credentials it ACCEPTS. Both halves are required.
    KAFKA_LISTENER_NAME_BROKER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_BROKER_USER}" password="${KAFKA_BROKER_PASSWORD}" user_${KAFKA_BROKER_USER}="${KAFKA_BROKER_PASSWORD}";'
    KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_BROKER_USER}" password="${KAFKA_BROKER_PASSWORD}" user_${KAFKA_BROKER_USER}="${KAFKA_BROKER_PASSWORD}";'
    # The SCRAM JAAS entries carry no credentials at all - the broker looks every SCRAM user up
    # in the cluster metadata. They still have to be present: without a JAAS context for the
    # listener the broker refuses to start with "Could not find a 'KafkaServer' or
    # '<listener>.KafkaServer' entry in the JAAS configuration".
    #
    # The THREE underscores are not a typo. cp-kafka builds kafka.properties from KAFKA_* env
    # vars by lowercasing and then replacing '___'->'-', '__'->'_', '_'->'.', in that order - so
    # SCRAM___SHA___512 is the only way to write the property key
    # listener.name.internal.scram-sha-512.sasl.jaas.config. Verify with:
    #   docker compose exec kafka1 grep jaas /etc/kafka/kafka.properties
    KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
    KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
    # ---- M14: authorization ------------------------------------------------------------------
    # KRaft's own authorizer (NOT kafka.security.authorizer.AclAuthorizer, which is the ZooKeeper
    # one and will not start on a KRaft cluster). ACLs live in the metadata log.
    KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
    # DENY BY DEFAULT. The whole point of the module: a principal with no matching ACL gets
    # nothing, not even topic metadata. Flip to "true" for a partial rollback that keeps
    # authentication but stops enforcing (see README's ROLLBACK section).
    KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
    # SEMICOLON-separated, not comma. A comma parses as ONE principal literally named
    # "broker,User:admin" and both superusers stop working - the cluster then fails to form,
    # because inter-broker replication is itself an authorized operation.
    KAFKA_SUPER_USERS: User:${KAFKA_BROKER_USER};User:${KAFKA_ADMIN_USER}
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    # ---- cluster-wide defaults, per docs/diagrams/topic-map.md "Cluster-wide defaults" ----
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_LOG_RETENTION_MS: 604800000 # 7 days
    KAFKA_LOG_CLEANUP_POLICY: delete
    KAFKA_COMPRESSION_TYPE: zstd
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false" # flipped deliberately in the M19 drill
    # Explicit topic creation only (create-topics.sh) - no accidental default-config topics.
    # Kafka Streams (M10) and Kafka Connect (M6/M13) create their own internal topics via the
    # AdminClient regardless of this setting, so disabling it here costs nothing later.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_PARTITIONS: 1

services:
  # ============================================================================================
  # Kafka brokers - 3-node KRaft cluster, combined broker+controller roles (fine for a laptop;
  # a real deployment would split dedicated controller nodes - see README "Compromises").
  # ============================================================================================
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    container_name: kafka1
    ports:
      - "${KAFKA1_EXTERNAL_PORT}:29092" # host tools -> EXTERNAL listener
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:9094,EXTERNAL://0.0.0.0:29092
      # Internal names resolve only inside kafka-psp-net; EXTERNAL name/port is what YOU dial
      # from the host - must match the host-side port this broker is actually published on.
      # CONTROLLER is never advertised (clients must not discover the controller quorum); BROKER
      # is advertised because inter-broker replication resolves peers through this same metadata.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,BROKER://kafka1:9094,EXTERNAL://localhost:${KAFKA1_EXTERNAL_PORT}
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    container_name: kafka2
    ports:
      - "${KAFKA2_EXTERNAL_PORT}:29092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:9094,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,BROKER://kafka2:9094,EXTERNAL://localhost:${KAFKA2_EXTERNAL_PORT}
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    container_name: kafka3
    ports:
      - "${KAFKA3_EXTERNAL_PORT}:29092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:9094,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,BROKER://kafka3:9094,EXTERNAL://localhost:${KAFKA3_EXTERNAL_PORT}
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ============================================================================================
  # M14 - kafka-init: the one-shot security bootstrap.
  #
  # Creates one SCRAM-SHA-512 credential per client principal and applies the entire ACL matrix,
  # then exits 0. Everything that needs a credential depends on it with
  # `condition: service_completed_successfully`, which is what guarantees no client ever starts
  # before its own credential exists (the failure that looks like a wrong password).
  #
  # It talks to the BROKER (inter-broker, SASL/PLAIN) listener, not the SCRAM one, for the
  # obvious reason: it is the thing that creates the SCRAM credentials.
  #
  # Idempotent - `kafka-configs --alter --add-config SCRAM-SHA-512=[...]` overwrites, and
  # `kafka-acls --add` on an existing binding is a no-op. Re-run any time:
  #   docker compose up kafka-init
  # ============================================================================================
  kafka-init:
    image: ${KAFKA_IMAGE}:${KAFKA_VERSION}
    container_name: kafka-init
    networks: [kafka-psp-net]
    restart: "no"
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    volumes:
      - ./kafka-init:/opt/kafka-init:ro
    configs:
      - source: kafka-broker-admin-client
        target: /etc/kafka/secrets/broker-admin.properties
    # Bypasses the cp-kafka image's own entrypoint (/etc/confluent/docker/run) - this container
    # is not a broker, it just borrows the image for its CLI tools.
    entrypoint: ["/bin/bash", "/opt/kafka-init/init-security.sh"]
    environment:
      BOOTSTRAP: kafka1:9094,kafka2:9094,kafka3:9094
      CLIENT_CONFIG: /etc/kafka/secrets/broker-admin.properties
      KAFKA_ADMIN_USER: ${KAFKA_ADMIN_USER}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      PAYMENT_API_KAFKA_PASSWORD: ${PAYMENT_API_KAFKA_PASSWORD}
      PSP_CONNECTOR_KAFKA_PASSWORD: ${PSP_CONNECTOR_KAFKA_PASSWORD}
      LEDGER_KAFKA_PASSWORD: ${LEDGER_KAFKA_PASSWORD}
      WEBHOOK_NOTIFIER_KAFKA_PASSWORD: ${WEBHOOK_NOTIFIER_KAFKA_PASSWORD}
      ANALYTICS_KAFKA_PASSWORD: ${ANALYTICS_KAFKA_PASSWORD}
      REALTIME_GATEWAY_KAFKA_PASSWORD: ${REALTIME_GATEWAY_KAFKA_PASSWORD}
      CONNECT_KAFKA_PASSWORD: ${CONNECT_KAFKA_PASSWORD}
      SCHEMA_REGISTRY_KAFKA_PASSWORD: ${SCHEMA_REGISTRY_KAFKA_PASSWORD}
      AKHQ_KAFKA_PASSWORD: ${AKHQ_KAFKA_PASSWORD}
      KAFKA_EXPORTER_KAFKA_PASSWORD: ${KAFKA_EXPORTER_KAFKA_PASSWORD}

  # ============================================================================================
  # Schema Registry - runs inside the compose network, so it is an INTERNAL client: it talks to
  # brokers over the PLAINTEXT listener using Compose DNS names, never EXTERNAL/localhost.
  # ============================================================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_VERSION}
    hostname: schema-registry
    container_name: schema-registry
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      # M14: its SCRAM credential and its ACLs on `_schemas` must exist before it starts.
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${SCHEMA_REGISTRY_PORT}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # M14: the scheme prefix here is the SECURITY PROTOCOL, not a listener name - it must match
      # SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL below or the store fails to connect with a
      # misleading "no resolvable bootstrap urls" error.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_PLAINTEXT://kafka1:9092,SASL_PLAINTEXT://kafka2:9092,SASL_PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: SCRAM-SHA-512
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="schema-registry" password="${SCHEMA_REGISTRY_KAFKA_PASSWORD}";'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ============================================================================================
  # AKHQ - Kafka UI. Also an internal client: connects via kafka1/2/3:9092, plus Schema Registry
  # over the Compose network. See akhq/application.yml.
  # ============================================================================================
  akhq:
    image: tchiotludo/akhq:${AKHQ_VERSION}
    hostname: akhq
    container_name: akhq
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${AKHQ_PORT}:8080"
    volumes:
      - ./akhq/application.yml:/app/application.yml:ro
    configs:
      # M14: the half of AKHQ's connection config that contains a password, rendered from .env at
      # `up` time so it never exists as a file in this repository. Micronaut merges the two files
      # in MICRONAUT_CONFIG_FILES order (later wins on a key collision; these two do not collide).
      #
      # Tried first and REJECTED: supplying the same three keys as
      # AKHQ_CONNECTIONS_KAFKA__PSP__COMPOSE_PROPERTIES_* environment variables, which is what
      # AKHQ's own docs suggest. The variables reached the container (verified with `docker
      # compose exec akhq env`) but never landed in the connection's `properties` map, and AKHQ's
      # only symptom was every API call failing after 60s with "Timed out waiting for a node
      # assignment. Call: listTopics" while the broker logged "Unexpected Kafka request of type
      # METADATA during SASL handshake" - i.e. AKHQ was still speaking PLAINTEXT. A second config
      # file is deterministic where the env-var name mangling is not.
      - source: akhq-security
        target: /app/application-security.yml
    environment:
      MICRONAUT_CONFIG_FILES: /app/application.yml,/app/application-security.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ============================================================================================
  # PostgreSQL - payment-api, ledger, psp-connector (docs/PLAN.md persistence table; ADR-0005).
  # One container, three logical databases + three scoped users - see postgres/init/.
  #
  # M6: `command` overrides the default `wal_level=replica` with `wal_level=logical`. Debezium's
  # Postgres connector doesn't poll tables - it opens a logical replication slot and streams the
  # write-ahead log itself, and Postgres physically cannot decode WAL records into row-level
  # changes at `wal_level=replica` (that level only carries enough information for physical
  # streaming replication/PITR, not logical decoding - this is a server-wide setting, not a
  # per-database or per-table one, so it's set once here for the whole cluster). Applied via
  # `command`, not `postgresql.conf` mounted over the entrypoint's own, so the image's default
  # config is otherwise untouched. `max_wal_senders`/`max_replication_slots` are left at
  # postgres:16's defaults (10 each) - one Debezium slot is nowhere near that ceiling.
  # ============================================================================================
  postgres:
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    container_name: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    networks: [kafka-psp-net]
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PAYMENT_API_DB: ${PAYMENT_API_DB}
      PAYMENT_API_DB_USER: ${PAYMENT_API_DB_USER}
      PAYMENT_API_DB_PASSWORD: ${PAYMENT_API_DB_PASSWORD}
      LEDGER_DB: ${LEDGER_DB}
      LEDGER_DB_USER: ${LEDGER_DB_USER}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      PSP_CONNECTOR_DB: ${PSP_CONNECTOR_DB}
      PSP_CONNECTOR_DB_USER: ${PSP_CONNECTOR_DB_USER}
      PSP_CONNECTOR_DB_PASSWORD: ${PSP_CONNECTOR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================================================
  # Kafka Connect (M6) - a single distributed-mode worker running Debezium's Postgres connector,
  # pre-bundled in the `debezium/connect` image (chosen over confluentinc/cp-kafka-connect +
  # `confluent-hub install debezium/debezium-connector-postgresql` purely to avoid a second,
  # separate plugin-install step for a one-connector stack - see README "Image choices"). This
  # worker is the payment-outbox relay: it streams payment-api's `outbox_event` table (via
  # Postgres logical replication, hence `wal_level=logical` above) and republishes each row to
  # `payments.payment-requested.v1` through the outbox event router SMT - registered separately
  # by `register-connector.sh` against the REST API below, not baked into this image.
  #
  # `CONNECT_*`-prefixed env vars are generic passthrough: the image's entrypoint strips the
  # `CONNECT_` prefix, lowercases what's left, and turns `_` into `.` to build
  # connect-distributed.properties (e.g. `CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE` ->
  # `value.converter.schemas.enable`) - the same convention as the un-prefixed KAFKA_* variables
  # on the brokers above, one layer further in. The un-prefixed vars (BOOTSTRAP_SERVERS, GROUP_ID,
  # *_STORAGE_TOPIC, KEY_CONVERTER, VALUE_CONVERTER) are the entrypoint's own named settings, not
  # passthrough.
  # ============================================================================================
  kafka-connect:
    image: debezium/connect:${DEBEZIUM_CONNECT_VERSION}
    hostname: kafka-connect
    container_name: kafka-connect
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy } # M13: the Mongo sink connector's write target
      # M14: the worker creates connect.configs/offsets/status itself on first start, which needs
      # both its SCRAM credential and its Create ACL on the `connect.` prefix to already exist.
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${KAFKA_CONNECT_PORT}:8083" # Connect REST API - register/inspect connectors here
    volumes:
      # M9 Phase 1: a tiny one-purpose SMT (source in
      # infra/compose/connect/plugins/outbox-bytebuffer-smt/src) that works around a real Kafka
      # Connect gap hit by this stack's outbox-serialization decision (option (a) in
      # services/payment-api/README.md's M9 section): with the outbox event router's
      # table.expand.json.payload=false, Debezium represents the outbox_event.payload BYTEA
      # column as java.nio.HeapByteBuffer, and org.apache.kafka.connect.converters.
      # ByteArrayConverter#fromConnectData only accepts byte[] - it throws DataException on
      # anything else. This SMT, chained after the outbox router
      # (payment-outbox-connector.json's "transforms": "outbox,byteBufferFix"), unwraps
      # ByteBuffer -> byte[] before ByteArrayConverter ever sees the value. Mounted as its own
      # plugin directory, matching every debezium-connector-* directory already baked into this
      # image under /kafka/connect - Kafka Connect plugin scanning happens once at worker
      # startup, so changes here need `docker compose up -d kafka-connect` to take effect.
      - ./connect/plugins/outbox-bytebuffer-smt:/kafka/connect/outbox-bytebuffer-smt:ro
      # M13: the MongoDB Kafka Connector's sink (org.mongodb.kafka:mongo-kafka-connect, the
      # official MongoDB-maintained connector - NOT the debezium-connector-mongodb directory
      # already baked into this image, which is a SOURCE connector reading MongoDB change
      # streams, the opposite direction from what M13 needs). debezium/connect ships zero
      # sink connectors, so this one has to be added the same way as the SMT above: download
      # once (the self-contained "-all" jar, every dependency shaded in, verified against its
      # published sha1 - see the plugin directory's own history), commit it, mount it read-only.
      # No confluent-hub CLI is present in this image and none is needed - Kafka Connect's
      # plugin scanner just needs one classloader-isolated directory per plugin under the path
      # this image already scans (/kafka/connect, same as every debezium-connector-* sibling).
      - ./connect/plugins/mongodb-kafka-connect:/kafka/connect/mongodb-kafka-connect:ro
      # M13: the Avro converter (io.confluent.connect.avro.AvroConverter +
      # kafka-avro-serializer/kafka-schema-registry-client and their transitive deps -
      # confluentinc-kafka-connect-avro-converter-7.7.1's full `lib/`, matching
      # SCHEMA_REGISTRY_VERSION so the converter and the running registry are the same
      # Confluent release, same reasoning as infra/compose/README.md's broker/registry image
      # choice). ledger.ledger-entry-recorded.v1 is Confluent-wire-format Avro (M9 Phase 2);
      # without this converter the sink falls back to Connect's default (JsonConverter) trying
      # to interpret Avro's magic byte + schema id as JSON and failing on the first record -
      # the "usual failure" this module's brief warns about. Debezium's image ships Avro (the
      # library) for its own connectors' internal use but not Kafka Connect's Avro *converter*
      # plugin, which is a Confluent artifact and has to be added the same way as the sink
      # itself.
      - ./connect/plugins/kafka-connect-avro-converter:/kafka/connect/kafka-connect-avro-converter:ro
    environment:
      BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      GROUP_ID: kafka-connect-psp
      # Connect's own bookkeeping topics - NOT in create-topics.sh on purpose (see the comment
      # there): the worker creates these itself via its embedded AdminClient on first start,
      # regardless of the brokers' auto.create.topics.enable=false, using the replication-factor
      # settings below.
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.status
      # Key = paymentId as plain text (ADR-0003); the outbox router sets this from
      # outbox_event.aggregate_id (see payment-outbox-connector.json). StringConverter matches
      # what payment-api's retired KafkaPaymentEventPublisher used (StringSerializer) and what
      # psp-connector's consumer expects (StringDeserializer).
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      # Value = plain JSON, no Connect schema/payload envelope - psp-connector's JsonDeserializer
      # expects raw JSON bytes it can hand straight to Jackson, not
      # {"schema":...,"payload":...}. schemas.enable=false is what strips that envelope.
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      # Matches the cluster-wide replication factor (docker-compose.yml top comment / topic-map);
      # a 3-broker cluster losing one broker must not lose Connect's own config/offsets/status.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "3"
      # offset.storage.partitions has no config-topic equivalent (config storage is always
      # exactly 1 partition, enforced by Connect itself, not configurable) - 25/5 are the
      # upstream-recommended defaults for a small cluster, made explicit rather than left
      # implicit (same style as the brokers' KAFKA_* block above).
      CONNECT_OFFSET_STORAGE_PARTITIONS: "25"
      CONNECT_STATUS_STORAGE_PARTITIONS: "5"
      # ---- M14: SASL, FOUR TIMES OVER - this is the module's nastiest trap ----------------------
      # The top-level trio below authenticates the WORKER's own clients: the KafkaBasedLog
      # instances behind connect.configs / connect.offsets / connect.status.
      #
      # It does NOT reach the clients Connect creates ON BEHALF OF a connector. Those are built
      # from `producer.` / `consumer.` / `admin.`-prefixed worker properties only - top-level
      # worker settings are not copied into them. Set only the top-level trio and you get the
      # worst possible outcome: the worker starts, its REST API answers, `GET
      # /connectors/<name>/status` reports connector RUNNING and task RUNNING (that status is read
      # out of connect.status, which the worker CAN reach), and not one record moves. The only
      # visible symptom is a repeating
      #   WARN [Producer clientId=connector-producer-payment-outbox-connector-0]
      #        Bootstrap broker kafka1:9092 (id: -1 rack: null) disconnected
      # in the Connect log, and
      #   Failed authentication ... (Unexpected Kafka request of type METADATA during SASL
      #   handshake)
      # in the broker log - neither of which says "authentication" in the client's own words.
      # This was caught during M14 verification, not predicted.
      #
      # `admin.` matters too: it is what creates mongo-audit-sink's errors.deadletterqueue topic.
      # One worker = one principal (`connect`) for all four; per-connector principals would need
      # connector.client.config.override.policy and are an M18/Strimzi refinement.
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_SASL_JAAS_CONFIG: &connect-jaas 'org.apache.kafka.common.security.scram.ScramLoginModule required username="connect" password="${CONNECT_KAFKA_PASSWORD}";'
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: *connect-jaas
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: *connect-jaas
      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_ADMIN_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_ADMIN_SASL_JAAS_CONFIG: *connect-jaas
    healthcheck:
      # The worker itself, not any connector running on it - proves the REST API is up and the
      # group of internal topics was created successfully. Connector/task RUNNING status is a
      # separate check (register-connector.sh does that after registering).
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ============================================================================================
  # MongoDB - webhook-notifier, analytics, audit-trail (docs/PLAN.md persistence table).
  # One container, three logical databases + three scoped users - see mongo/init/.
  # ============================================================================================
  mongodb:
    image: mongo:${MONGO_VERSION}
    hostname: mongodb
    container_name: mongodb
    networks: [kafka-psp-net]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      WEBHOOK_NOTIFIER_DB: ${WEBHOOK_NOTIFIER_DB}
      WEBHOOK_NOTIFIER_DB_USER: ${WEBHOOK_NOTIFIER_DB_USER}
      WEBHOOK_NOTIFIER_DB_PASSWORD: ${WEBHOOK_NOTIFIER_DB_PASSWORD}
      ANALYTICS_DB: ${ANALYTICS_DB}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      AUDIT_TRAIL_DB: ${AUDIT_TRAIL_DB}
      AUDIT_TRAIL_DB_USER: ${AUDIT_TRAIL_DB_USER}
      AUDIT_TRAIL_DB_PASSWORD: ${AUDIT_TRAIL_DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================================================
  # M13 - MinIO: the claim-check pattern's object store (payment-api uploads dispute documents
  # over 512 KiB, analytics dereferences them). One instance, one root credential, no per-service
  # MinIO users - see the k8s minio subchart's values.yaml top comment for the full reasoning
  # (same simplification, mirrored here for compose parity). payment-api and analytics both run on
  # the HOST (java -jar ...), so they reach this over its published host port, same host/compose-
  # network split every other infra address in this file follows - see their
  # application-docker-compose.yml files.
  # ============================================================================================
  minio:
    image: minio/minio:${MINIO_VERSION}
    hostname: minio
    container_name: minio
    command: ["server", "/data", "--console-address", ":9090"]
    networks: [kafka-psp-net]
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT}:9000"     # S3 API - what payment-api/analytics's S3Client dials
      - "${MINIO_CONSOLE_PORT}:9090" # Web console - http://localhost:${MINIO_CONSOLE_PORT}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ============================================================================================
  # Metrics: kafka-exporter (protocol-based, not JMX - see README "Metrics" section for why)
  # ============================================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION}
    hostname: kafka-exporter
    container_name: kafka-exporter
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    command:
      - "--kafka.server=kafka1:9092"
      - "--kafka.server=kafka2:9092"
      - "--kafka.server=kafka3:9092"
      - "--kafka.version=3.8.0"
      - "--web.listen-address=:9308"
      # M14. This exporter is protocol-based (see "Metrics" in README), so it is a Kafka client
      # like any other and needs a principal. Its ACLs are Describe-only on Topic:*/Group:*/
      # Cluster - it reads offsets and lag metadata, never a message body, which is exactly the
      # kind of distinction per-principal ACLs exist to make. Sarama spells the mechanism
      # lower-case with no second hyphen: `scram-sha512`, not `SCRAM-SHA-512`.
      - "--sasl.enabled"
      - "--sasl.mechanism=scram-sha512"
      - "--sasl.username=kafka-exporter"
      - "--sasl.password=${KAFKA_EXPORTER_KAFKA_PASSWORD}"
    ports:
      - "${KAFKA_EXPORTER_PORT}:9308"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9308/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ============================================================================================
  # M15 - Tempo: the tracing backend. Single-binary/monolithic mode (see tempo/tempo.yaml's
  # top comment). The six Spring services below run on the HOST, so they reach Tempo's OTLP/HTTP
  # receiver via its published host port (management.otlp.tracing.endpoint in each service's
  # application-docker-compose.yml), same host/compose-network split every other infra address in
  # this file already follows. Grafana (below) reaches it over the compose network instead, via
  # the Tempo datasource in grafana/provisioning/datasources/datasource.yml.
  # ============================================================================================
  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    hostname: tempo
    container_name: tempo
    networks: [kafka-psp-net]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_OTLP_HTTP_PORT}:4318" # OTLP/HTTP - the six Spring services push spans here
      - "${TEMPO_QUERY_PORT}:3200"     # Tempo's query API - Grafana's datasource reads this
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    hostname: prometheus
    container_name: prometheus
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      kafka-exporter: { condition: service_healthy }
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ============================================================================================
  # M16 - discovery-server (Netflix Eureka), compose-profile only (ADR-0009). The one Spring
  # service in this repo that runs AS A CONTAINER rather than on the host, alongside the six
  # pipeline services and api-gateway - see services/discovery-server/README.md's "Why this
  # service runs in a container". Build its jar first:
  #   mvn -pl services/discovery-server -am package -DskipTests
  #   docker compose -f infra/compose/docker-compose.yml build discovery-server
  # ============================================================================================
  discovery-server:
    build:
      context: ../../services/discovery-server
      dockerfile: Dockerfile
    hostname: discovery-server
    container_name: discovery-server
    networks: [kafka-psp-net]
    restart: unless-stopped
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761" # the six services + api-gateway (all HOST processes)
                                         # reach this via localhost:${DISCOVERY_SERVER_PORT}
    environment:
      SPRING_PROFILES_ACTIVE: docker-compose
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ============================================================================================
  # M16 - Redis: backs api-gateway's Resilience4j-adjacent RequestRateLimiter filter
  # (spring.cloud.gateway.default-filters, org.springframework.cloud.gateway.filter.ratelimit.
  # RedisRateLimiter). Nothing else in this stack uses it. api-gateway runs on the HOST like the
  # six pipeline services, so it reaches Redis via this published host port - see
  # services/api-gateway/README.md's "Rate limit" section for the exact configuration.
  # ============================================================================================
  redis:
    image: redis:${REDIS_VERSION}
    hostname: redis
    container_name: redis
    networks: [kafka-psp-net]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    hostname: grafana
    container_name: grafana
    networks: [kafka-psp-net]
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_healthy } # M15: the Tempo datasource below needs it reachable
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # NOT nested under the provisioning/dashboards mount above - Docker cannot create a
      # mountpoint inside a path that's already the target of another bind mount (this bit us
      # during verification: grafana/dashboards was originally mounted at
      # /etc/grafana/provisioning/dashboards/files and the container failed to start with
      # "read-only file system" trying to create that mountpoint). Kept as a sibling path
      # instead, referenced by dashboard.yml's `options.path`.
      - ./grafana/dashboards:/etc/grafana/dashboards-data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
